name: Actualizar datos de viento (GFS)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/wind-data.yml'
  schedule:
    # ~4.5h después de cada ciclo GFS (00/06/12/18Z), para dar tiempo a que NOMADS lo publique
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar eccodes y dependencias Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          pip install cfgrib xarray numpy

      - name: Bajar y decodificar viento GFS
        run: python scripts/fetch_wind_grib.py

      - name: Preparar sitio para Pages
        run: |
          mkdir -p public_site
          cp -r public/* public_site/ 2>/dev/null || true
          cp index.html public_site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
