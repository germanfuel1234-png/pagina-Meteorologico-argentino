# nginx.conf — frontend del mapa del tiempo SMN
# Servimos index.html y reenviamos /api/* al backend FastAPI.
# El frontend usa rutas relativas /api/* (mismo origen), así no se
# necesita configurar CORS ni URLs absolutas.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache corto para el HTML (los datos vienen de /api).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API del proxy SMN (FastAPI).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Respuestas JSON cacheadas por el proxy: evitar cache en nginx.
        add_header Cache-Control "no-store";
    }

    # Cache para los assets tile-style (imágenes Leaflet, etc.).
    location ~* \.(png|jpe?g|gif|svg|webp|woff2?|css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}